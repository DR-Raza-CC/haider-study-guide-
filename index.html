<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Haider Study Guide</title>
<meta name="description" content="Weekly GCSE study guides, questions, streaks and a parent dashboard.">
<meta name="theme-color" content="#0f6b73">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Study Guide">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}

/* Layout: one narrow study column, a fixed bottom bar holding the single "next" button. */
:root{
  --paper:#f1f6f5; --card:#ffffff; --ink:#13282b; --muted:#56706f; --line:#d5e3e2;
  --accent:#0f6b73; --accent-ink:#ffffff; --tint:#dcefee; --hi:#ffd53d; --hi-ink:#2a2300;
  --good:#1b8a5a; --good-bg:#dff4ea; --bad:#c2413a; --bad-bg:#fbe4e2;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e1a1b; --card:#152527; --ink:#e3f0ef; --muted:#97b3b1; --line:#27403f;
  --accent:#5cc3cb; --accent-ink:#082022; --tint:#1a3a3c; --hi:#ffd53d; --hi-ink:#2a2300;
  --good:#5fd39d; --good-bg:#173a2c; --bad:#ff8a80; --bad-bg:#3d1d22; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1a1b; --card:#152527; --ink:#e3f0ef; --muted:#97b3b1; --line:#27403f;
  --accent:#5cc3cb; --accent-ink:#082022; --tint:#1a3a3c; --hi:#ffd53d; --hi-ink:#2a2300;
  --good:#5fd39d; --good-bg:#173a2c; --bad:#ff8a80; --bad-bg:#3d1d22; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 150px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.02rem;font-weight:700}
p{margin:0}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.mark{background:linear-gradient(transparent 55%,var(--hi) 55%);color:inherit;padding:0 .1em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:1.7rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.8rem;color:var(--muted)}
.stat.streak{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.stat.streak span{color:var(--hi-ink);opacity:.85}
svg text{fill:var(--muted);font-family:var(--body);font-size:11px}
.chart{width:100%;height:auto;display:block}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.day{aspect-ratio:1;max-width:100%;border-radius:5px;background:var(--line)}
.day.on{background:var(--good)}
.day.today{outline:2px solid var(--accent);outline-offset:1px}
.sbar{display:grid;grid-template-columns:minmax(0,9.5em) 1fr auto;gap:10px;align-items:center;font-size:.9rem}
.sbar .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:999px}
.sbar .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem}
.topics{display:flex;flex-direction:column;gap:8px}
.tp{font:inherit;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;gap:12px;align-items:center;min-width:0}
.tp .txt{display:flex;flex-direction:column;min-width:0;flex:1}
.tp small{color:var(--muted);font-size:.75rem}
.tp .t{font-weight:700;overflow-wrap:anywhere}
.tp .badge{font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums;padding:3px 9px;border-radius:999px;background:var(--tint);color:var(--accent);white-space:nowrap}
.tp.done .badge{background:var(--good-bg);color:var(--good)}
.tp.next{border:2px solid var(--accent)}
.tp:focus-visible,.opt:focus-visible,.main:focus-visible,.link:focus-visible,.chip:focus-within,.btn2:focus-visible,input:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.subject{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--accent);color:var(--accent-ink)}
.list{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.example{background:var(--tint);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.example .ans{font-weight:700}
.stepnum{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1;color:var(--accent)}
.progress{height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.q{font-family:var(--display);font-size:1.28rem;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{font:inherit;font-size:1rem;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;overflow-wrap:anywhere}
.opt.sel{border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.fb{border-radius:12px;padding:12px 14px;font-size:.95rem}
.fb.good{background:var(--good-bg)}
.fb.bad{background:var(--bad-bg)}
.bonus-tag{display:inline-block;background:var(--hi);color:var(--hi-ink);font-weight:700;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px}
.big{font-family:var(--display);font-size:3.4rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
label.field{display:flex;flex-direction:column;gap:6px;font-weight:700}
input[type=text]{font:inherit;font-size:1.1rem;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.chip{display:flex;gap:10px;align-items:center;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;cursor:pointer;font-weight:700;min-width:0}
.chip input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:0}
.chip.on{border-color:var(--accent);background:var(--tint)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:4px;align-items:center}
.main{width:100%;font-family:var(--display);font-size:1.15rem;font-weight:700;border:0;border-radius:14px;padding:16px;background:var(--accent);color:var(--accent-ink);cursor:pointer;transition:transform .1s}
.main:active{transform:scale(.98)}
.main:disabled{opacity:.45;cursor:not-allowed}
.link{font:inherit;font-size:.9rem;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px}
.note{font-size:.82rem;color:var(--muted)}
.btn2{font:inherit;font-size:.85rem;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn2.danger{border-color:var(--bad);color:var(--bad)}
.wa{display:block;text-align:center;font-weight:700;text-decoration:none;padding:12px 14px;border-radius:12px;border:2px solid var(--good);color:var(--good);background:var(--good-bg)}
.wa:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
textarea{font:inherit;font-size:.85rem;width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--paper);color:var(--ink);resize:vertical}
.center{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding-block:24px 8px}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.role{font:inherit;text-align:left;display:flex;flex-direction:column;gap:4px;padding:18px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.role b{font-family:var(--display);font-size:1.25rem}
.role span{color:var(--muted);font-size:.9rem}
.role.on,.role:hover{border-color:var(--accent)}
.role.on{background:var(--tint)}
.role:focus-visible,.kidcard:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.kids{display:flex;flex-direction:column;gap:12px}
.kidcard{font:inherit;text-align:left;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;cursor:pointer}
.kidcard:hover{border-color:var(--accent)}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-size:.8rem;color:var(--muted)}
.mini b{display:block;font-family:var(--display);font-size:1.25rem;color:var(--ink);font-variant-numeric:tabular-nums}
.pill{font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--line);color:var(--muted);white-space:nowrap}
.pill.live{background:var(--good-bg);color:var(--good)}
.error{margin:0;padding:10px 14px;border-radius:10px;background:var(--bad-bg);color:var(--ink);font-weight:700}
.hint{font-weight:400;font-size:.82rem;color:var(--muted)}
.note.warn{background:var(--hi);color:var(--hi-ink);padding:8px 12px;border-radius:10px}
.note.ok{color:var(--good);font-weight:700}
.inline{display:flex;flex-direction:column;gap:8px;align-items:flex-start;margin-top:6px}
.stats.two{grid-template-columns:1fr 1fr}
.q.small{font-size:1.1rem}
input[type=password]{font:inherit;font-size:1.3rem;letter-spacing:.3em;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:100%;max-width:220px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:420px){.mini{grid-template-columns:repeat(2,1fr)}}
@media (max-width:420px){.big{font-size:2.8rem}.stat b{font-size:1.4rem}.sbar{grid-template-columns:minmax(0,7em) 1fr auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="bar" id="bar"><div class="bar-in">
  <button class="main" id="main" type="button">Start</button>
  <div id="sub"></div>
</div></div>
<script src="/data.js"></script>
<script src="/app.js"></script>
</body>
</html>
